name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # ── Lint and Type Check ──────────────────────────────────────────────────────

  lint-web:
    name: Lint Web (Next.js)
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: src/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  lint-api:
    name: Lint API (Express)
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: src/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: node --check index.js

  # ── Build Docker Images ──────────────────────────────────────────────────────

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint-web, lint-api]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: src/api
          push: false
          tags: api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: src/web
          push: false
          tags: web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build DB migrations image
        uses: docker/build-push-action@v6
        with:
          context: src/db
          push: false
          tags: db:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Integration Test with Docker Compose ─────────────────────────────────────

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: build-images

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start services
        run: docker compose up --build -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for web service to be ready..."
          timeout 60 bash -c 'until curl -f http://localhost:3000 > /dev/null 2>&1; do sleep 2; done'
          echo "Web service is ready!"

      - name: Check API health
        run: |
          echo "Checking API health through web service..."
          docker compose exec -T web curl -f http://api:3001/health

      - name: Test task creation
        run: |
          echo "Testing task creation..."
          docker compose exec -T web curl -f -X POST http://api:3001/tasks \
            -H "Content-Type: application/json" \
            -d '{"title":"Test task from CI"}'

      - name: Test task listing
        run: |
          echo "Testing task listing..."
          docker compose exec -T web curl -f http://api:3001/tasks

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down -v

  # ── Summary ──────────────────────────────────────────────────────────────────

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [lint-web, lint-api, build-images, integration-test]
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.lint-web.result }}" != "success" ] || \
             [ "${{ needs.lint-api.result }}" != "success" ] || \
             [ "${{ needs.build-images.result }}" != "success" ] || \
             [ "${{ needs.integration-test.result }}" != "success" ]; then
            echo "❌ Build failed"
            exit 1
          else
            echo "✅ Build successful"
          fi
